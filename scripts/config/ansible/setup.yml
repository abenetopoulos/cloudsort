---
- hosts: cloudlab
  gather_facts: false
  strategy: free
  vars:
    data_disks:
      - /dev/nvme1n1
    fstype: xfs
    mnt_prefix: /mnt/data
    tmpfs_path: /mnt/tmpfs
    awsdir: ~/.aws
    workdir: ~/cloudsort
    pythondir: ~/.pyenv/shims/
    pyenv_bin: ~/.pyenv/bin/pyenv
    hosts_path: /etc/hosts
    hadoop_config_dir: /opt/hadoop/etc/hadoop
  environment:
    CC: /home/ubuntu/intel/oneapi/compiler/latest/linux/bin/icx
    CXX: /home/ubuntu/intel/oneapi/compiler/latest/linux/bin/icpx
    CFLAGS: "-Ofast -xHost -ipo"
    CXXFLAGS: "-Ofast -xHost -ipo"
  tasks:
    - name: Create a filesystem on each of the data disks
      become: true
      community.general.filesystem:
        fstype: "{{ fstype }}"
        dev: "{{ item }}"
      loop: "{{ data_disks }}"

    - name: Create data disk mount points
      become: true
      ansible.builtin.file:
        path: "{{ mnt_prefix }}{{ item }}"
        state: directory
        mode: "0777"
      loop: "{{ range(data_disks|length)|list }}"

    - name: Mount the data disks
      become: true
      ignore_errors: true
      ansible.posix.mount:
        path: "{{ mnt_prefix }}{{ idx }}"
        src: "{{ item }}"
        fstype: "{{ fstype }}"
        state: mounted
      when: mnt_prefix and data_disks
      loop: "{{ data_disks }}"
      loop_control:
        index_var: idx

    - name: Set permission for disk mount points
      become: true
      ansible.builtin.file:
        path: "{{ mnt_prefix }}{{ item }}"
        state: directory
        mode: "0777"
      loop: "{{ range(data_disks|length)|list }}"

    - name: Create tmpfs mount point
      become: true
      ansible.builtin.file:
        path: "{{ tmpfs_path }}"
        state: directory
        mode: "0777"

    - name: Mount tmpfs
      become: true
      ignore_errors: true
      ansible.posix.mount:
        path: "{{ tmpfs_path }}"
        src: tmpfs
        fstype: tmpfs
        state: mounted

        # - name: Sync aws directory
        #   ansible.posix.synchronize:
        #     src: "{{ awsdir }}/"
        #     dest: "{{ awsdir }}"
        #     delete: true

    - name: Sync workdir
      ansible.posix.synchronize:
        src: "{{ workdir }}/"
        dest: "{{ workdir }}"
        delete: true
        rsync_opts:
          - --exclude=.git
          - --exclude=data
          - --exclude=ray

    - name: Install Pyenv
      ansible.builtin.shell: |
        curl -fsSL https://pyenv.run | bash
        echo 'export PYENV_ROOT="$HOME/.pyenv"' >> ~/.bashrc
        echo '[[ -d $PYENV_ROOT/bin ]] && export PATH="$PYENV_ROOT/bin:$PATH"' >> ~/.bashrc
        echo 'eval "$(pyenv init - bash)"' >> ~/.bashrc

        echo 'export PYENV_ROOT="$HOME/.pyenv"' >> ~/.profile
        echo '[[ -d $PYENV_ROOT/bin ]] && export PATH="$PYENV_ROOT/bin:$PATH"' >> ~/.profile
        echo 'eval "$(pyenv init - bash)"' >> ~/.profile

        sudo apt update && sudo apt install -y build-essential libssl-dev zlib1g-dev \
        libbz2-dev libreadline-dev libsqlite3-dev curl git \
        libncursesw5-dev xz-utils tk-dev libxml2-dev libxmlsec1-dev libffi-dev liblzma-dev
      changed_when: true

    - name: Install Python
      ansible.builtin.shell: |
        {{ pyenv_bin }} install 3.9.13
        {{ pyenv_bin }} global 3.9.13
      changed_when: true

    - name: Install Python dependencies
      ansible.builtin.shell: |
        {{ pythondir }}/pip uninstall -y ray
        {{ pythondir }}/pip install -Ur {{ workdir }}/requirements/worker.txt
      changed_when: true

    - name: Install project packages
      ansible.builtin.shell: |
        cd {{ workdir }} && {{ pythondir }}/pip install -e .
        rm -rf {{ workdir }}/cloudsort/sortlib/build
        cd {{ workdir }}/cloudsort/sortlib && {{ pythondir }}/python setup.py build_ext --inplace
      changed_when: true

    - name: Set soft and hard ulimit
      become: true
      community.general.pam_limits:
        domain: "*"
        limit_type: "{{ item }}"
        limit_item: nofile
        value: 65535
      loop:
        - hard
        - soft

        # - name: Check Hadoop files exist
        #   delegate_to: localhost
        #   ansible.builtin.stat:
        #     path: "{{ hadoop_config_dir }}"
        #   register: hadoop

    - name: Sync hosts file
      become: true
      ansible.builtin.copy:
        src: "{{ hosts_path }}"
        dest: "{{ hosts_path }}"
        mode: "0644"
      when: hadoop.stat.exists

      # - name: Sync Hadoop config files
      #   ansible.builtin.copy:
      #     src: "{{ hadoop_config_dir }}/{{ item }}"
      #     dest: "{{ hadoop_config_dir }}/{{ item }}"
      #     mode: "0644"
      #   loop:
      #     - core-site.xml
      #     - hdfs-site.xml
      #     - yarn-site.xml
      #   when: hadoop.stat.exists
